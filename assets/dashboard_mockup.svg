<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <style>
    .bg { fill:#f4f6f8; }
    .panel { fill:#ffffff; stroke:#dfe3ea; stroke-width:2; rx:20; }
    .header { font: 22px 'Segoe UI', sans-serif; fill:#2c3e50; }
    .label { font: 14px 'Segoe UI', sans-serif; fill:#4b5563; }
    .metric { font: 18px 'Segoe UI Semibold', sans-serif; fill:#111827; }
    .bar { fill:#7dd3fc; }
    .pie { fill:#fda4af; }
    .line { fill:none; stroke:#34d399; stroke-width:4; }
    .dot { fill:#10b981; }
  </style>
  <rect width="900" height="520" class="bg" />
  <rect x="30" y="30" width="840" height="220" class="panel" />
  <text x="50" y="60" class="header">Dashboard Overview</text>
  <text x="50" y="90" class="label">KPI cards</text>
  <rect x="50" y="100" width="190" height="80" rx="16" fill="#ffffff" stroke="#d1d5db" />
  <text x="65" y="128" class="label">Total Spent</text>
  <text x="65" y="155" class="metric">€2,450</text>
  <rect x="260" y="100" width="190" height="80" rx="16" fill="#ffffff" stroke="#d1d5db" />
  <text x="275" y="128" class="label">Avg Transaction</text>
  <text x="275" y="155" class="metric">€42</text>
  <rect x="470" y="100" width="190" height="80" rx="16" fill="#ffffff" stroke="#d1d5db" />
  <text x="485" y="128" class="label">Top Category</text>
  <text x="485" y="155" class="metric">Food</text>
  <rect x="680" y="100" width="190" height="80" rx="16" fill="#ffffff" stroke="#d1d5db" />
  <text x="695" y="128" class="label">Feedback</text>
  <text x="695" y="155" class="metric">12 items</text>
  <rect x="30" y="270" width="420" height="220" class="panel" />
  <text x="50" y="300" class="header">Spending by Category</text>
  <rect x="60" y="330" width="60" height="100" class="bar" />
  <rect x="140" y="330" width="60" height="70" class="bar" />
  <rect x="220" y="330" width="60" height="110" class="bar" />
  <rect x="300" y="330" width="60" height="50" class="bar" />
  <rect x="380" y="330" width="60" height="90" class="bar" />
  <text x="70" y="450" class="label">Food</text>
  <text x="150" y="450" class="label">Transport</text>
  <text x="230" y="450" class="label">Shopping</text>
  <text x="310" y="450" class="label">Utilities</text>
  <text x="390" y="450" class="label">Leisure</text>
  <rect x="470" y="270" width="380" height="220" class="panel" />
  <text x="490" y="300" class="header">Transaction History</text>
  <rect x="490" y="330" width="120" height="28" rx="8" fill="#eef2ff" />
  <rect x="620" y="330" width="220" height="28" rx="8" fill="#eef2ff" />
  <rect x="490" y="370" width="350" height="110" rx="10" fill="#ffffff" stroke="#d1d5db" />
  <text x="510" y="396" class="label">2026-05-01</text>
  <text x="510" y="418" class="label">Panificio Manauzzi — €12.50 — Food</text>
  <text x="510" y="440" class="label">Uber Italia — €18.00 — Transport</text>
  <line x1="60" y1="220" x2="380" y2="220" class="line" />
  <circle cx="120" cy="220" r="5" class="dot" />
  <circle cx="220" cy="190" r="5" class="dot" />
  <circle cx="320" cy="180" r="5" class="dot" />
  <circle cx="380" cy="170" r="5" class="dot" />
  <path d="M60 220 C 100 195 180 200 220 190 C 260 180 320 175 380 170" class="line" />
  <text x="520" y="380" class="label">Category breakouts, trends, feedback</text>
