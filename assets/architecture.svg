<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <style>
    .box { fill:#fff; stroke:#2c3e50; stroke-width:2; rx:12; }
    .text { font: 16px 'Segoe UI', sans-serif; fill:#2c3e50; }
    .small { font: 14px 'Segoe UI', sans-serif; fill:#34495e; }
    .arrow { stroke:#2c3e50; stroke-width:2; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>
  <rect x="30" y="30" width="180" height="80" class="box" />
  <text x="120" y="55" text-anchor="middle" class="text">CSV Ingest</text>
  <text x="120" y="75" text-anchor="middle" class="small">revolut.csv → DuckDB</text>

  <rect x="250" y="30" width="220" height="80" class="box" />
  <text x="360" y="55" text-anchor="middle" class="text">Transform</text>
  <text x="360" y="75" text-anchor="middle" class="small">clean, normalize, dedupe</text>

  <rect x="520" y="30" width="240" height="80" class="box" />
  <text x="640" y="55" text-anchor="middle" class="text">Classification</text>
  <text x="640" y="75" text-anchor="middle" class="small">retrieval → rules → LLM</text>

  <rect x="260" y="170" width="220" height="80" class="box" />
  <text x="370" y="195" text-anchor="middle" class="text">Analytics</text>
  <text x="370" y="215" text-anchor="middle" class="small">metrics, trends, reporting</text>

  <rect x="520" y="170" width="240" height="80" class="box" />
  <text x="640" y="195" text-anchor="middle" class="text">Dashboard</text>
  <text x="640" y="215" text-anchor="middle" class="small">Streamlit + Plotly</text>

  <path d="M210 70 L250 70" class="arrow" />
  <path d="M470 70 L520 70" class="arrow" />
  <path d="M360 110 L360 170" class="arrow" />
  <path d="M520 210 L520 210" class="arrow" />
  <path d="M590 110 L590 170" class="arrow" />

  <rect x="30" y="170" width="180" height="80" class="box" fill="#ecf0f1" />
  <text x="120" y="195" text-anchor="middle" class="text">Memory</text>
  <text x="120" y="215" text-anchor="middle" class="small">DuckDB embeddings</text>
  <path d="M210 210 L250 210" class="arrow" />
</svg>
